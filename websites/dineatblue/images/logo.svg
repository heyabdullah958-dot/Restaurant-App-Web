<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="30%" stop-color="#FFDF73" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D1F4D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050A18" rx="24" />

  <!-- Outer Elegant Border -->
  <rect x="12" y="12" width="816" height="296" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" rx="18" />
  <rect x="18" y="18" width="804" height="284" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="6 4" stroke-opacity="0.3" rx="14" />

  <!-- Emblem on Left -->
  <g transform="translate(130, 160)">
    <!-- Ambient Sapphire Glow -->
    <circle cx="0" cy="0" r="85" fill="#0284C7" opacity="0.12" filter="url(#glow)" />
    <circle cx="0" cy="0" r="70" fill="#0D1F4D" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Nautical Helm Spokes -->
    <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.75">
      <line x1="0" y1="-70" x2="0" y2="70" />
      <line x1="-70" y1="0" x2="70" y2="0" />
      <line x1="-49" y1="-49" x2="49" y2="49" />
      <line x1="-49" y1="49" x2="49" y2="-49" />
    </g>

    <!-- Ocean Crest Waves -->
    <path d="M -45,15 C -30,5 -15,25 0,15 C 15,5 30,25 45,15 C 45,22 30,32 0,22 C -30,32 -45,22 -45,15 Z" fill="url(#sapphireGrad)" />
    <path d="M -35,28 C -20,20 -10,34 0,28 C 10,20 20,34 35,28 C 35,32 20,38 0,32 C -20,38 -35,32 -35,28 Z" fill="url(#goldGrad)" opacity="0.8" />

    <!-- Stylized Royal Lobster / Crab Pincers Crest -->
    <path d="M 0,-48 C -15,-48 -28,-36 -28,-22 C -28,-14 -22,-8 -16,-6 C -24,-2 -26,10 -20,16 C -14,20 -8,18 -4,12 C -2,6 -2,-12 0,-18 C 2,-12 2,6 4,12 C 8,18 14,20 20,16 C 26,10 24,-2 16,-6 C 22,-8 28,-14 28,-22 C 28,-36 15,-48 0,-48 Z M -14,-34 C -10,-34 -7,-30 -8,-24 C -9,-18 -14,-16 -18,-18 C -20,-22 -18,-34 -14,-34 Z M 14,-34 C 18,-34 20,-22 18,-18 C 14,-16 9,-18 8,-24 C 7,-30 10,-34 14,-34 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Crown Finial -->
    <polygon points="0,-56 -7,-48 7,-48" fill="url(#goldGrad)" />
    <circle cx="-10" cy="-50" r="2.5" fill="#FFDF73" />
    <circle cx="0" cy="-58" r="3" fill="#FFDF73" />
    <circle cx="10" cy="-50" r="2.5" fill="#FFDF73" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(240, 0)">
    <!-- Brand Name Top Pre-header -->
    <text x="0" y="88" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="600" letter-spacing="6" fill="url(#goldGrad)">
      EST. 2025 · LAHORE
    </text>

    <!-- Main Wordmark -->
    <text x="0" y="160" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="56" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      DINE AT <tspan fill="url(#goldGrad)">BLUE</tspan>
    </text>

    <!-- Ocean Wave Motif Divider -->
    <path d="M 0,186 Q 25,178 50,186 T 100,186 T 150,186 T 200,186 T 250,186 T 300,186 T 350,186 T 400,186 T 450,186 T 500,186" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="250" cy="186" r="4" fill="url(#goldGrad)" />

    <!-- Subtitle -->
    <text x="0" y="224" font-family="'Poppins', 'Montserrat', sans-serif" font-size="15" font-weight="600" letter-spacing="7" fill="#94A3B8">
      SEA FOOD RESTAURANT
    </text>

    <!-- Fine Tagline -->
    <text x="0" y="254" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="500" letter-spacing="3" fill="url(#goldGrad)" opacity="0.9">
      FINE CASUAL OCEAN DINING · FRESH CATCH DAILY
    </text>
  </g>
</svg>
