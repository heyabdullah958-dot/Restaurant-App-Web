<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="30%" stop-color="#FFDF73" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="sapphireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081430" />
      <stop offset="50%" stop-color="#050A18" />
      <stop offset="100%" stop-color="#02050E" />
    </linearGradient>
    <linearGradient id="sapphireGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D1F4D" />
    </linearGradient>
    <filter id="glowSquare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sapphireBg)" rx="100" />
  <rect x="18" y="18" width="476" height="476" fill="none" stroke="url(#goldGradSquare)" stroke-width="2.5" stroke-opacity="0.45" rx="86" />
  <rect x="28" y="28" width="456" height="456" fill="none" stroke="url(#goldGradSquare)" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.3" rx="76" />

  <!-- Center Emblem -->
  <g transform="translate(256, 210)">
    <!-- Ambient Sapphire Glow -->
    <circle cx="0" cy="0" r="130" fill="#0284C7" opacity="0.16" filter="url(#glowSquare)" />
    <circle cx="0" cy="0" r="115" fill="#0D1F4D" stroke="url(#goldGradSquare)" stroke-width="3" />
    <circle cx="0" cy="0" r="102" fill="none" stroke="url(#goldGradSquare)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

    <!-- Nautical Helm Spokes -->
    <g stroke="url(#goldGradSquare)" stroke-width="2.5" opacity="0.75">
      <line x1="0" y1="-115" x2="0" y2="115" />
      <line x1="-115" y1="0" x2="115" y2="0" />
      <line x1="-81" y1="-81" x2="81" y2="81" />
      <line x1="-81" y1="81" x2="81" y2="-81" />
    </g>

    <!-- Ocean Crest Waves -->
    <path d="M -75,25 C -50,8 -25,40 0,25 C 25,8 50,40 75,25 C 75,36 50,52 0,36 C -50,52 -75,36 -75,25 Z" fill="url(#sapphireGradSquare)" />
    <path d="M -55,44 C -30,30 -15,54 0,44 C 15,30 30,54 55,44 C 55,50 30,60 0,50 C -30,60 -55,50 -55,44 Z" fill="url(#goldGradSquare)" opacity="0.85" />

    <!-- Stylized Royal Lobster / Crab Pincers Crest -->
    <path d="M 0,-78 C -24,-78 -45,-58 -45,-35 C -45,-22 -35,-12 -25,-9 C -38,-3 -42,16 -32,26 C -22,32 -12,28 -6,19 C -3,9 -3,-19 0,-28 C 3,-19 3,9 6,19 C 12,28 22,32 32,26 C 42,16 38,-3 25,-9 C 35,-12 45,-22 45,-35 C 45,-58 24,-78 0,-78 Z M -22,-54 C -16,-54 -11,-48 -13,-38 C -14,-28 -22,-25 -28,-28 C -32,-35 -28,-54 -22,-54 Z M 22,-54 C 28,-54 32,-35 28,-28 C 22,-25 14,-28 13,-38 C 11,-48 16,-54 22,-54 Z" fill="url(#goldGradSquare)" filter="url(#glowSquare)" />
    <!-- Crown Finial -->
    <polygon points="0,-90 -11,-78 11,-78" fill="url(#goldGradSquare)" />
    <circle cx="-16" cy="-80" r="3.5" fill="#FFDF73" />
    <circle cx="0" cy="-93" r="4.5" fill="#FFDF73" />
    <circle cx="16" cy="-80" r="3.5" fill="#FFDF73" />
  </g>

  <!-- Typography Bottom -->
  <text x="256" y="390" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="46" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#FFFFFF">
    DINE AT <tspan fill="url(#goldGradSquare)">BLUE</tspan>
  </text>
  <text x="256" y="425" font-family="'Poppins', 'Montserrat', sans-serif" font-size="16" font-weight="600" letter-spacing="8" text-anchor="middle" fill="#94A3B8">
    SEAFOOD RESTAURANT
  </text>
  <path d="M 156,448 Q 206,440 256,448 T 356,448" fill="none" stroke="url(#goldGradSquare)" stroke-width="2" stroke-linecap="round" />
  <circle cx="256" cy="448" r="4" fill="url(#goldGradSquare)" />
</svg>
